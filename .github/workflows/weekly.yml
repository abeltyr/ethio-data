name: Weekly collection (food & commodity prices)

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Fetch food & commodity prices
        run: |
          FEWS_START=$(date -u -d '120 days ago' +%F)
          bun run src/cli.ts wfp prices || true
          bun run src/cli.ts fewsnet prices "$FEWS_START" || true
          bun run src/cli.ts worldbank_rtp prices || true
          bun run src/cli.ts twomerkato ecx || true

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data || true
          git diff --staged --quiet || git commit -m "data: weekly price update ($(date -u +%F))"
          git push
